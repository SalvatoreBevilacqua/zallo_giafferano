<!-- login.html -->
{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col s12 m8 offset-m2 l6 offset-l3">
            <div class="card login-card">
                <div class="card-image">
                    <img src="https://images.unsplash.com/photo-1556911220-bff31c812dba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80" 
                         alt="Food background">
                    <span class="card-title text-shadow">Log In</span>
                </div>
                
                <div class="card-content">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="row">
                            <div class="input-field col s12">
                                <i class="material-icons prefix">account_circle</i>
                                <input id="username" name="username" type="text" minlength="3"
                                       maxlength="15" pattern="^[a-zA-Z0-9]{3,15}$" class="validate" required>
                                <label for="username">Username</label>
                                <span class="helper-text" data-error="Username must be 3-15 characters, letters and numbers only">
                                    3-15 characters, letters and numbers only
                                </span>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="input-field col s12">
                                <i class="material-icons prefix">vpn_key</i>
                                <input id="password" name="password" type="password" minlength="5"
                                       maxlength="15" pattern="^[a-zA-Z0-9]{5,15}$" class="validate" required>
                                <label for="password">Password</label>
                                <span class="helper-text" data-error="Password must be 5-15 characters, letters and numbers only">
                                    5-15 characters, letters and numbers only
                                </span>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col s12 center-align">
                                <button class="btn-large waves-effect waves-light indigo lighten-1" type="submit">
                                    Log In<i class="material-icons right">login</i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="card-action center-align">
                    <p>Don't have an account?</p>
                    <a href="{{ url_for('register') }}" class="btn waves-effect waves-light amber darken-2">
                        Register<i class="material-icons right">person_add</i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
